<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function login() {
    return new Promise(function(resolve, reject) {

        setTimeout(function() {

            let success = true;

            if (success) {
                resolve("Login successful");
            } else {
                reject("Login failed");
            }

        }, 2000);

    });
}

async function userLogin() {

    try {
        let result = await login();
        console.log(result);

    } catch(error) {
        console.log(error);
    }

}

userLogin();
    </script>
</body>
</html>
